<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Обзор креативов</title><style>body{font:17px system-ui;background:#f4f5f7;color:#17212b;margin:0;padding:32px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}article{background:white;border-radius:16px;padding:24px}button{padding:12px;border:0;border-radius:8px;background:#153e75;color:white}label{display:block;margin-top:16px}small{display:block;color:#54616f}img{width:100%;height:auto}textarea{width:100%;min-height:70px}</style><main><h1>Обзор креативов</h1><p>Выберите варианты для теста. Источники и неподтверждённые утверждения указаны в каждой карточке.</p><section class="grid" id="cards"></section><p><button id="save">Скачать решения</button></p></main><script>
// Replace DATA with approved actual concepts. Text is inserted with textContent, never HTML.
const DATA=[];const decisions={};const root=document.getElementById('cards');
for(const c of DATA){const card=document.createElement('article');for(const [tag,v] of [['h2',c.headline],['p',c.copy],['small','Источники: '+(c.sources||[]).join('; ')],['small','Основа: '+(c.grounding||'не указана')]]){const e=document.createElement(tag);e.textContent=v||'';card.append(e)}if(c.image){const u=new URL(c.image,location.href);if(['https:','http:','data:','file:'].includes(u.protocol)){const img=document.createElement('img');img.src=c.image;img.alt=c.alt||'';card.prepend(img)}}const l=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.onchange=()=>decisions[c.id]={...(decisions[c.id]||{}),selected:check.checked};l.append(check,document.createTextNode(' Выбрать для теста'));card.append(l);const note=document.createElement('textarea');note.placeholder='Комментарий';note.oninput=()=>decisions[c.id]={...(decisions[c.id]||{}),comment:note.value};card.append(note);root.append(card)}
if(!DATA.length)root.textContent='Добавьте реальные креативы в массив DATA. Это шаблон, а не готовая подборка.';
document.getElementById('save').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(decisions,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='creative-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></html>
